<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Case</title>
</head>

<body>

    <script>
        let day = 5;

        switch (day) {
            case 1:
                document.write("Senin");
                break;

            case 2:
                document.write("Selasa");
                break;

            case 3:
                document.write("Rabu");
                break;

            case 4:
                document.write("Kamis");
                break;

            case 5:
                document.write("Jumat");
                break;

            case 6:
                document.write("Sabtu");
                break;

            case 7:
                document.write("Minggu");
                break;

            default:
                document.write("Akhir Pekan");
        }
    </script>

</body>

</html>
