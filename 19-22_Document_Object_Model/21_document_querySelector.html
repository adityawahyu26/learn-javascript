<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>querySelector</title>
</head>

<body>
    <p id="hallo">text lama</p>
    <script>
        let hi = document.querySelector("#hallo");
        hi.innerHTML = "text baru";
    </script>
</body>

</html>
