<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>getElementById</title>
</head>

<body>
    <h1 id="makanan"></h1>

    <script>
        let input = prompt("apa makanan favoritmu?");
        let output = document.getElementById("makanan");
        output.innerHTML = `Wow!! jadi makanan favoritmu itu ${input}, keren banget!!`;

    </script>

</body>

</html>
