<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For of Array</title>
</head>

<body>

    <script>
        let warna = ["merah", "biru", "kuning", "hijau", "ungu"];

        for (let item of warna) {
            document.write(`<p>saya suka warna ${item}</p>`);
        }
    </script>

</body>

</html>
