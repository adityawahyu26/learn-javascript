<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Loop Array</title>
</head>

<body>

    <script>
        let bulan = ["januari", "februari", "maret", "april"];

        for (let i = 0; i < bulan.length; i++) {
            document.write(`<p>ini adalah bulan ${bulan[i]}</p>`);
        }
    </script>

</body>

</html>
