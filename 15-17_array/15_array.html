<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
</head>

<body>

    <script>
        let buah = ["apel", "jeruk", "melon"];
        buah.push("pepaya");
        buah.unshift("pisang");
        buah[3] = "durian";

        console.log(buah);
    </script>

</body>

</html>
