<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perulangan While</title>
</head>

<body>

    <script>
        let input = prompt("Masukkan Username Anda : ");

        while (input !== "admin") {
            alert("Maaf, username anda salah, silahkan coba lagi!")
            input = prompt("Masukkan Username Anda : ");
        }

        alert("Selamat, anda berhasil Login!!");
    </script>

</body>

</html>
