<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Else if</title>
</head>

<body>

    <script>
        let nilai = 54;

        if (nilai >= 90) {
            document.write("nilai A");
        } else if (nilai >= 80) {
            document.write("nilai B");
        } else if (nilai >= 70) {
            document.write("nilai C");
        } else {
            document.write("Belajar lagi!");
        }
    </script>

</body>

</html>
